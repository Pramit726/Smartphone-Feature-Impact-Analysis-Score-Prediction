[pytest]
# Test discovery
testpaths = ml/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts = -ra -q --html=reports/test_report.html --self-contained-html

# Warning control (IMPORTANT)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Optional: show summary of skipped/failed
# addopts = -ra

# Optional: log config
log_cli = true
log_cli_level = INFO